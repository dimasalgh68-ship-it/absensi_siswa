<svg height="512px" width="512px" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" xml:space="preserve">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009ee0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f4f8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle style="fill:url(#bgGradient);" cx="256" cy="256" r="256"/>
  
  <!-- Shadow Effect -->
  <path style="fill:#0077b6;opacity:0.3;" d="M512,256c0-7.982-0.384-15.87-1.098-23.666L350.594,72.027l-14.489,58.515v-7.856l-171.911,44.497 l46.282,46.28l5.875,40.239l44.229,27.583l-3.644,29.018L256,444.48l60.347,60.347C428.606,477.696,512,376.596,512,256z"/>
  
  <!-- Face Circle (Main) -->
  <circle style="fill:url(#faceGradient);stroke:#ffffff;stroke-width:8;" cx="256" cy="220" r="110"/>
  
  <!-- Face Detection Frame -->
  <g style="fill:none;stroke:#48cae4;stroke-width:6;stroke-linecap:round;">
    <!-- Top Left Corner -->
    <path d="M 180,140 L 150,140 L 150,170"/>
    <!-- Top Right Corner -->
    <path d="M 332,140 L 362,140 L 362,170"/>
    <!-- Bottom Left Corner -->
    <path d="M 180,300 L 150,300 L 150,270"/>
    <!-- Bottom Right Corner -->
    <path d="M 332,300 L 362,300 L 362,270"/>
  </g>
  
  <!-- Eyes -->
  <circle style="fill:#0077b6;" cx="226" cy="210" r="12"/>
  <circle style="fill:#0077b6;" cx="286" cy="210" r="12"/>
  
  <!-- Smile -->
  <path style="fill:none;stroke:#0077b6;stroke-width:6;stroke-linecap:round;" d="M 220,245 Q 256,265 292,245"/>
  
  <!-- Clock Icon (Bottom Right) -->
  <g transform="translate(340, 360)">
    <circle style="fill:#ffffff;stroke:#009ee0;stroke-width:6;" cx="0" cy="0" r="50"/>
    <path style="fill:none;stroke:#009ee0;stroke-width:5;stroke-linecap:round;" d="M 0,-25 L 0,0 L 20,0"/>
    <circle style="fill:#009ee0;" cx="0" cy="0" r="5"/>
  </g>
  
  <!-- Checkmark Badge (Top Right) -->
  <g transform="translate(360, 140)">
    <circle style="fill:#00d084;" cx="0" cy="0" r="35"/>
    <path style="fill:none;stroke:#ffffff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;" d="M -12,0 L -5,10 L 15,-10"/>
  </g>
  
  <!-- Text: ABSENSI -->
  <text x="256" y="410" style="font-family:Arial,sans-serif;font-size:48px;font-weight:bold;fill:#ffffff;text-anchor:middle;">ABSENSI</text>
  
  <!-- Scan Lines Effect -->
  <g style="opacity:0.3;">
    <line x1="150" y1="180" x2="362" y2="180" style="stroke:#48cae4;stroke-width:2;"/>
    <line x1="150" y1="220" x2="362" y2="220" style="stroke:#48cae4;stroke-width:2;"/>
    <line x1="150" y1="260" x2="362" y2="260" style="stroke:#48cae4;stroke-width:2;"/>
  </g>
</svg>
